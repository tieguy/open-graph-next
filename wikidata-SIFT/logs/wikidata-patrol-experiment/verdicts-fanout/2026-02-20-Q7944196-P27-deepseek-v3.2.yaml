rationale: The edit sets country of citizenship to 'Second Polish Republic' (Q207272),
  but citizenship is a legal status tied to states, not historical geopolitical entities.
  Stanisław Świtalski was born in 1890 in Horodok, which was part of Austria-Hungary.
  Multiple independent sources confirm his birth in Austria-Hungary and Polish nationality.
  The Picryl page states he was an 'Austro-Hungarian-born Polish colonel'. The Polish
  Wikipedia article, which is the source for most other claims in the item, also lists
  him as Polish. The concept of 'Second Polish Republic' as a 'country of citizenship'
  is problematic; modern Poland (Q36) or historical 'Austria-Hungary' (Q28513) followed
  by 'Poland' would be more appropriate. Since the claim uses a historical state entity
  for citizenship and lacks direct reference support, and all evidence points to him
  being ethnically Polish and a Polish officer, the claim is weakly supported.
