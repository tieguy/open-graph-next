rationale: The edit incorrectly uses Q105543609 (a Wikidata metaclass for the concept
  of musical compositions) as the value for P2550 (recording or performance of). P2550
  should point to a specific musical work/composition item, not the abstract concept.
  Q105543609's own documentation explicitly defines it as a 'Wikidata metaclass' and
  'legal concept' intended for use with P31 (instance of), and states it is 'NOT applicable
  to recordings...or individual publications of music on physical media.' Q138319606
  is a single and audio recording, making this ontologically incorrect — it conflates
  a classification mechanism with a specific work reference.
