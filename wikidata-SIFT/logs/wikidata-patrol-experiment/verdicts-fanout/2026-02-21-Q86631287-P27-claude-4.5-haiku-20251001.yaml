rationale: Muhammad ibn Sulayman al-Kurdi (1717–1780) was an Ottoman subject, not
  a citizen of an independent Kurdistan. Kurdistan did not exist as a sovereign nation-state
  during his lifetime; it was part of the Ottoman Empire (~70% of the region) and
  Persian Empire. The Turkish Islamic Encyclopedia reference confirms his nisba 'al-Kurdi'
  indicates Kurdish ethnic origin but describes him as embedded in Ottoman institutional
  frameworks (Mufti positions, teaching in Ottoman-administered Medina). Multiple
  independent sources explicitly identify him as born in the Ottoman province of Syria
  and operating within Ottoman scholarly networks. The earliest discussion of an independent
  Kurdish state appeared in the 1920 Treaty of Sèvres, over 140 years after his death.
  Assigning 'Kurdistan' as his citizenship is anachronistic and projects a modern
  nation-state back into a period where it did not exist.
