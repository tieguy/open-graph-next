rationale: The edit changed the 'readable file format' for OpenJPEG from 'TIFF' (which,
  in this context, refers to TIFF files with embedded JPEG 2000 support) to 'Portable
  Graymap, binary variant' (PGM binary). However, according to the official OpenJPEG
  documentation and repository README, OpenJPEG is a JPEG 2000 codec that supports
  JPEG 2000 formats (JP2, JP3, JPC, J2K) and some TIFF files with JPEG 2000, but it
  does NOT support the PGM or PGM binary format. Therefore, the change is factually
  incorrect and misrepresents OpenJPEG's capabilities.
