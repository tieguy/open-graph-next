rationale: Multiple independent sources confirm that Stanisław Świtalski was a Polish
  military officer who served the Second Polish Republic from 1914-1939, commanding
  the Polish 16th Infantry Division during WWII. While born in 1890 in Horodok under
  Austro-Hungarian rule, his adult citizenship was in the Second Polish Republic (1918-1939),
  the state in which he held rank and served. The Treaty of Riga (1921) established
  Grodek Jagiellonski within Polish territory. Historical records document him as
  a Colonel in the Polish Army participating in Polish-Soviet War and WWII operations.
  The edit accurately reflects his country of citizenship during his entire period
  of military service.
