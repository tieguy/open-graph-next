rationale: The edit sets Joseph ha-Kohen's date of death to 1575, but evidence indicates
  this represents the end date of his chronicle, not his actual death. The Jewish
  Encyclopedia states he 'died in 1575 or shortly after,' but scholarly sources (Pollak
  1975, Cassen 2014) explicitly distinguish between when his chronicle reaches 1575
  and when he died, with Pollak stating 'He seems to have died either in 1577 or in
  1578.' The National Library of Israel Authority File (already in Wikidata as the
  preferred statement) indicates 'no earlier than 1577,' and Encyclopedia.com cites
  1578. While 1575 is chronologically plausible as an earliest possible bound, multiple
  authoritative sources favor 1577 as the actual death year. Setting 1575 without
  qualification obscures this historical uncertainty and conflicts with the item's
  own preferred statement.
