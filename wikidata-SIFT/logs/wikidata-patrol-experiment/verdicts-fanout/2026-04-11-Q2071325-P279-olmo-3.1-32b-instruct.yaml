  of Madurese is based on an obsolete system and explicitly references Wouk and Ross
  (2002), which itself no longer maintains this classification. Wikipedia and other
  linguistic resources align with the Javanic classification for Kangean. Therefore,
  changing the P279 from Madurese to Javanic is correct.
