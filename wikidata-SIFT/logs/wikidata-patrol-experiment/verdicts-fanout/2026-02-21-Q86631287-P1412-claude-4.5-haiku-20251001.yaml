rationale: Muhammad ibn Sulayman al-Kurdi's epithet 'al-Kurdi' indicates Kurdish ethnic
  origin, and historical sources confirm that Kurdish Islamic scholars of the 17th-18th
  centuries were typically multilingual, using Kurdish for teaching and explanation
  while writing formal works in Arabic. The comprehensive Islamic Encyclopedia biography
  and the MuslimMatters article on Kurdish scholars confirm his prominence and multilingual
  scholarly tradition. However, no direct evidence was found explicitly documenting
  that al-Kurdi himself spoke Kurdish as a living language. All his documented works
  are in Arabic, and his entire professional life was spent in Damascus and Medina
  (major Arab centers). While the claim is consistent with the linguistic practices
  of Kurdish scholars of his era and his ethnic background, it lacks explicit primary
  source confirmation.
