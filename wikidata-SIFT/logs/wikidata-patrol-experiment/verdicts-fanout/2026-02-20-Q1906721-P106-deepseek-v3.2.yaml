rationale: The edit adds 'video game' (Q7889) as an occupation for Masahiro Sakurai.
  However, Q7889 represents the electronic game itself ('electronic game with user
  interface and visual feedback'), not a profession. Multiple independent sources
  confirm Sakurai is a 'video game designer', 'video game director', and 'video game
  developer' - all distinct professions from 'video game'. The WiKirby page states
  his role as 'Game Designer & Director', the SmashWiki page lists his occupation
  as 'Video game director, game designer, founder of Sora Ltd.', and Video Games Chronicle
  describes him as a 'Japanese video game designer'. Using Q7889 as an occupation
  is a category error - one cannot have 'video game' as an occupation; one creates
  video games or works in the video game industry. The item also shows extensive vandalism
  with incorrect gender, citizenship, birth date, and other claims, suggesting this
  entire edit session is problematic.
