rationale: The edit adds a URL (https://www.iflk.ch/wp-content/uploads/2021/01/zhaw.png)
  as the value for P3295 'code'. Wikidata property P3295 is defined as 'format used
  to represent a specific concept in a given encoding' and is a string data type intended
  for alphanumeric codes or encoding systems (e.g., NLA codes, product codes). An
  image URL is semantically inappropriate for this property. While the URL points
  to the IFLK domain (the official developer of LimbiCODE), and the folder structure
  suggests it may be related to the ZHAW validation report from 2021, the property
  P3295 is designed for encoding/code values, not for image or document URLs. The
  claim lacks any reference URL supporting this specific assignment. A more appropriate
  property would be P18 (image) if an image is intended, or a description/documentation
  property if linking to validation materials.
