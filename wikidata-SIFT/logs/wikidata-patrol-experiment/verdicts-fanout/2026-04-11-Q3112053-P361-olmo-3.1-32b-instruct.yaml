rationale: The change from 'Srivijaya' to 'Samudra Pasai' for the 'part of' property
  of Melayu (Kingdom) is suspect because, while Samudra Pasai is historically an Islamic
  sultanate in northern Sumatra that succeeded or was related to earlier polities,
  authoritative sources indicate that the Melayu Kingdom is most commonly and traditionally
  associated with the Srivijayan sphere of influence and is often considered a successor
  or part of the Srivijaya maritime empire. Multiple reliable secondary sources and
  historical syntheses trace the Melayu Kingdom's origins to the Srivijaya tradition
  rather than directly to Samudra Pasai, which emerged later and was more distinctively
  Islamic. The edit appears to conflate or oversimplify the complex historical relationship
  between these polities. No primary source directly states that Melayu is part of
  Samudra Pasai, and the change may reflect an error in attribution or an unwarranted
  conflation of two related but distinct entities.
