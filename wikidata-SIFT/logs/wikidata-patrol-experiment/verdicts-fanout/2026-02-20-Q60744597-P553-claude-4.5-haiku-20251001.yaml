rationale: The edit changes P553 'website account on' from Q102345381 ('social media
  account') to Q202833 ('social media'), which violates Wikidata's semantic model.
  P553 is explicitly defined as a property for referencing specific websites or platforms
  where an organization has an account. Q202833 'social media' is a conceptual category
  representing the entire social media domain, not a specific platform or account
  type. Wikidata's own property documentation and best practice guides consistently
  show P553 pointing to specific platforms (Twitter, LinkedIn, Facebook) or account
  types like Q102345381, never to abstract concepts. The URL qualifier in the statement
  (https://uk.linkedin.com/company/global-banking-finance-review) proves this represents
  a specific LinkedIn company account, making Q102345381 or a specific platform entity
  semantically appropriate, but Q202833 factually incorrect for this property.
