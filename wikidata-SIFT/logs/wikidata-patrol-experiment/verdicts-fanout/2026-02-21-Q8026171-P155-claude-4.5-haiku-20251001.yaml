rationale: While Zombie Influx (released September 15, 2009) was chronologically released
  before Winter's Eve (November 27, 2009), the claim is suspect because Zombie Influx
  is credited to Buzz-Works, not Nox Arcana. Wikidata's P155 property denotes the
  'immediately prior item in a series of which the subject is a part.' Winter's Eve
  belongs to the Nox Arcana album series, whose immediately prior album is Blackthorn
  Asylum (June 21, 2009), not the Buzz-Works project. The P175 qualifier incorrectly
  attributes Buzz-Works as the performer of Winter's Eve, when Winter's Eve's performer
  is Nox Arcana.
