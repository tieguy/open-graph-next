rationale: The edit changed the operator of RCA Milano from 'RCA Italiana S.p.A.'
  (Q63284163) to 'RCA Italiana' (Q21130152). However, multiple independent sources
  indicate that RCA Milano was a sub-label of RCA Italiana, not the reverse operator
  relationship. The WordPress article explicitly lists 'RCA Milano (Proprietà)' as
  one of the labels owned by RCA Italiana, meaning RCA Milano was property of RCA
  Italiana. The musicavincent blog confirms RCA Milano followed RCA Italiana's catalog
  numbering system. The Wikimedia Commons category states RCA Italiana is an 'imprint
  of RCA Italiana S.p.A.' Given that RCA Milano was a sub-label owned by RCA Italiana,
  it's more accurate to say RCA Italiana (or RCA Italiana S.p.A.) was the operator
  of RCA Milano, not the other way around. The edit appears to invert the correct
  relationship.
